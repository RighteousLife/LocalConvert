name: LocalConvert
options:
  bundleIdPrefix: com.localconvert
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug

settings:
  base:
    ARCHS: "arm64"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  LocalConvert:
    type: application
    platform: macOS
    info:
      path: LocalConvert/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.localconvert.url
            CFBundleURLSchemes:
              - localconvert
        NSServices:
          - NSMenuItem:
              default: "Convert with LocalConvert"
            NSMessage: handleServicesConvert
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: "Convert to PDF"
            NSMessage: handleConvertPDF
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: "Convert to WebP"
            NSMessage: handleConvertWebP
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: "Convert to MP4"
            NSMessage: handleConvertMP4
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: "Extract Audio (LocalConvert)"
            NSMessage: handleExtractAudio
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: "Merge PDFs"
            NSMessage: handleMergePDFs
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - com.adobe.pdf
          - NSMenuItem:
              default: "Extract PDF Pages"
            NSMessage: handleExtractPDF
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - com.adobe.pdf
          - NSMenuItem:
              default: "Compress PDF"
            NSMessage: handleCompressPDF
            NSPortName: LocalConvert
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendFileTypes:
              - com.adobe.pdf
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supported Conversion Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
    sources:
      - path: LocalConvert
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "Frameworks/**"
          - "Resources/**"
    postBuildScripts:
      - name: Copy Bundled Binaries and Runtime
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/LocalConvert/Resources/ffmpeg/ffmpeg
          - $(SRCROOT)/LocalConvert/Resources/ffmpeg/ffprobe
          - $(SRCROOT)/LocalConvert/Resources/ffmpeg/FFmpeg-LICENSE.txt
          - $(SRCROOT)/LocalConvert/Resources/ffmpeg/FFmpeg-BUILDCONF.txt
          - $(SRCROOT)/LocalConvert/Resources/AppIcon.icns
          - $(SRCROOT)/LocalConvert/Resources/THIRD_PARTY_NOTICES.md
          - $(SRCROOT)/LICENSE
          - $(SRCROOT)/LocalConvert/Frameworks/LICENSE.webp
          - $(SRCROOT)/LocalConvert/Frameworks/LICENSE.jxl
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ffmpeg/ffmpeg
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ffmpeg/ffprobe
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ffmpeg/FFmpeg-LICENSE.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ffmpeg/FFmpeg-BUILDCONF.txt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/THIRD_PARTY_NOTICES.md
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE.webp
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LICENSE.jxl
          - $(DERIVED_FILE_DIR)/bundled-runtime-copied.stamp
        script: |
          set -e
          SIGN_ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ -z "${SIGN_ID}" ]; then
            SIGN_ID="-"
          fi
          sign_macho() {
            local target="$1"
            if [ "${SIGN_ID}" = "-" ]; then
              /usr/bin/codesign --force --sign - --timestamp=none "${target}"
            else
              /usr/bin/codesign --force --options runtime --timestamp --sign "${SIGN_ID}" "${target}"
            fi
          }

          FFMPEG_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ffmpeg"
          mkdir -p "${FFMPEG_DST}"
          cp -p "${SRCROOT}/LocalConvert/Resources/ffmpeg/ffmpeg" "${FFMPEG_DST}/ffmpeg"
          cp -p "${SRCROOT}/LocalConvert/Resources/ffmpeg/ffprobe" "${FFMPEG_DST}/ffprobe"
          cp -p "${SRCROOT}/LocalConvert/Resources/ffmpeg/FFmpeg-LICENSE.txt" "${FFMPEG_DST}/FFmpeg-LICENSE.txt"
          cp -p "${SRCROOT}/LocalConvert/Resources/ffmpeg/FFmpeg-BUILDCONF.txt" "${FFMPEG_DST}/FFmpeg-BUILDCONF.txt"
          chmod +x "${FFMPEG_DST}/ffmpeg" "${FFMPEG_DST}/ffprobe"
          sign_macho "${FFMPEG_DST}/ffmpeg"
          sign_macho "${FFMPEG_DST}/ffprobe"

          if [ -f "${SRCROOT}/LocalConvert/Resources/AppIcon.icns" ]; then
            cp -p "${SRCROOT}/LocalConvert/Resources/AppIcon.icns" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          fi

          if [ -f "${SRCROOT}/LocalConvert/Resources/THIRD_PARTY_NOTICES.md" ]; then
            cp -p "${SRCROOT}/LocalConvert/Resources/THIRD_PARTY_NOTICES.md" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/THIRD_PARTY_NOTICES.md"
          fi
          if [ -f "${SRCROOT}/LICENSE" ]; then
            cp -p "${SRCROOT}/LICENSE" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LICENSE"
          fi
          if [ -f "${SRCROOT}/LocalConvert/Frameworks/LICENSE.webp" ]; then
            cp -p "${SRCROOT}/LocalConvert/Frameworks/LICENSE.webp" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LICENSE.webp"
          fi
          if [ -f "${SRCROOT}/LocalConvert/Frameworks/LICENSE.jxl" ]; then
            cp -p "${SRCROOT}/LocalConvert/Frameworks/LICENSE.jxl" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LICENSE.jxl"
          fi

          LIBREOFFICE_SRC="${SRCROOT}/LocalConvert/Resources/LibreOffice"
          LIBREOFFICE_DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LibreOffice"
          if [ -d "${LIBREOFFICE_SRC}" ]; then
            mkdir -p "${LIBREOFFICE_DST}"
            rsync -a --delete --exclude='__pycache__' --exclude='*.pyc' --exclude='.DS_Store' "${LIBREOFFICE_SRC}/" "${LIBREOFFICE_DST}/"
            find "${LIBREOFFICE_DST}" -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find "${LIBREOFFICE_DST}" \( -name "*.pyc" -o -name ".DS_Store" \) -delete 2>/dev/null || true
            chmod +x "${LIBREOFFICE_DST}/Contents/MacOS/soffice"
            if [ "${SIGN_ID}" != "-" ] || ! /usr/bin/codesign --verify --deep --strict "${LIBREOFFICE_DST}" >/dev/null 2>&1; then
              find "${LIBREOFFICE_DST}/Contents" -type f ! -name '*.o' | while IFS= read -r macho_file; do
                if /usr/bin/file -b "${macho_file}" | /usr/bin/grep -q "Mach-O"; then
                  sign_macho "${macho_file}" >/dev/null
                fi
              done
              PY_VERSIONS_DIR="${LIBREOFFICE_DST}/Contents/Frameworks/LibreOfficePython.framework/Versions"
              if [ -d "${PY_VERSIONS_DIR}" ]; then
                for ver_dir in "${PY_VERSIONS_DIR}"/*; do
                  [ -d "${ver_dir}" ] && [ ! -L "${ver_dir}" ] || continue
                  if [ -d "${ver_dir}/Resources/Python.app" ]; then
                    sign_macho "${ver_dir}/Resources/Python.app" >/dev/null
                  fi
                  sign_macho "${ver_dir}" >/dev/null
                done
              fi
              if [ -d "${LIBREOFFICE_DST}/Contents/Frameworks/LibreOfficePython.framework" ]; then
                sign_macho "${LIBREOFFICE_DST}/Contents/Frameworks/LibreOfficePython.framework" >/dev/null
              fi
              sign_macho "${LIBREOFFICE_DST}" >/dev/null
            fi
          fi
          mkdir -p "${DERIVED_FILE_DIR}"
          touch "${DERIVED_FILE_DIR}/bundled-runtime-copied.stamp"
    dependencies:
      - framework: LocalConvert/Frameworks/libwebp.dylib
        embed: true
        codeSign: true
      - framework: LocalConvert/Frameworks/libsharpyuv.dylib
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localconvert.app
        PRODUCT_NAME: LocalConvert
        INFOPLIST_KEY_CFBundleDisplayName: LocalConvert
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 LocalConvert. All rights reserved."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_FILE: "$(SRCROOT)/LocalConvert/Info.plist"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "LocalConvert/LocalConvert.entitlements"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_TESTING_SEARCH_PATHS: true
        # WebP & JPEG XL (libjxl v0.13.0) C/C++ bridges
        SWIFT_OBJC_BRIDGING_HEADER: "LocalConvert/LocalConvert-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/LocalConvert/Frameworks/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/LocalConvert/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/LocalConvert/Frameworks/libjxl.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libjxl_threads.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libjxl_cms.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libhwy.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libbrotlienc.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libbrotlidec.a"
          - "$(SRCROOT)/LocalConvert/Frameworks/libbrotlicommon.a"
          - "-lc++"
      configs:
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false

  LocalConvertTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocalConvertTests
        excludes:
          - "**/.DS_Store"
      - path: LocalConvertTestSupport
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: LocalConvert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localconvert.tests
        PRODUCT_NAME: LocalConvertTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalConvert.app/Contents/MacOS/LocalConvert"
        BUNDLE_LOADER: "$(TEST_HOST)"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/LocalConvert/Frameworks/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/LocalConvert/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

  LocalConvertUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LocalConvertUITests
        excludes:
          - "**/.DS_Store"
      - path: LocalConvertTestSupport
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: LocalConvert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localconvert.uitests
        PRODUCT_NAME: LocalConvertUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: LocalConvert
        CODE_SIGN_STYLE: Automatic

schemes:
  LocalConvert:
    build:
      targets:
        LocalConvert: all
    test:
      targets:
        - name: LocalConvertTests
        - name: LocalConvertUITests
    run:
      targets:
        - LocalConvert



